name: Vérifications et installateur Windows
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Installer la chaîne Rust épinglée
        shell: pwsh
        run: rustup show
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Tester et construire l’interface
        run: |
          npm test
          npm run build
      - name: Vérifier le format Rust
        run: cargo fmt --all -- --check
      - name: Tester le cœur et la couche Windows
        run: cargo test --workspace --locked
      - name: Vérifier les avertissements Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Construire l’installateur NSIS sans release
        run: npm run tauri build -- --ci --bundles nsis -- --locked
      - name: Conserver l’installateur de test
        uses: actions/upload-artifact@v4
        with:
          name: AutoStudio-Windows-non-signe
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
